policies:
  api-gateway-access-logging-should-be-configured:
    path: "policies/api-gateway/api-gateway-access-logging-should-be-configured.sentinel"
    governed_resources: ["aws_apigatewayv2_stage"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "API Gateway"
    description: "This policy checks if 'aws_apigatewayv2_stage' have access logging configured."
    type: "sentinel"
  api-gateway-cache-enabled-and-encrypted:
    path: "policies/api-gateway/api-gateway-cache-enabled-and-encrypted.sentinel"
    governed_resources: ["aws_api_gateway_method_settings", "aws_api_gateway_stage"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "API Gateway"
    description: "This policy verifies that all methods in Amazon API Gateway stages have cache enabled and encrypted. It checks both aws_api_gateway_stage and aws_api_gateway_method_settings resources."
    type: "sentinel"
  api-gateway-rest-and-websocket-api-logging-enabled:
    path: "policies/api-gateway/api-gateway-rest-and-websocket-api-logging-enabled.sentinel"
    governed_resources: ["aws_api_gateway_method_settings"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "API Gateway"
    description: "This policy checks for resource type of 'aws_api_gateway_method_settings' whether all stages of an Amazon API Gateway REST or WebSocket API have logging enabled."
    type: "sentinel"
  api-gateway-rest-configure-ssl-certificates:
    path: "policies/api-gateway/api-gateway-rest-configure-ssl-certificates.sentinel"
    governed_resources: ["aws_api_gateway_stage"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "API Gateway"
    description: "This policy checks whether 'aws_api_gateway_stage' have SSL certificates configured."
    type: "sentinel"
  appsync-field-level-logging-should-be-enabled:
    path: "policies/appsync/appsync-field-level-logging-should-be-enabled.sentinel"
    governed_resources: ["aws_appsync_graphql_api"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "AppSync"
    description: "This policy requires resources of type `aws_appsync_graphql_api` have attribute `log_config` with `field_log_level` set to `ERROR` or `ALL`."
    type: "sentinel"
  athena-workgroup-encrypted-at-rest:
    path: "policies/athena/athena-workgroup-encrypted-at-rest.sentinel"
    governed_resources: ["aws_athena_workgroup"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "Athena"
    description: "This policy ensures that Amazon Athena workgroups are encrypted at rest."
    type: "sentinel"
  aurora-recovery-point-created:
    path: "policies/aurora/aurora-recovery-point-created.sentinel"
    governed_resources: ["aws_backup_plan", "aws_backup_selection", "aws_rds_cluster"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "Aurora"
    description: "This policy ensures that a recovery point was created for Amazon Aurora DB clusters within the specified time period to enable backup and disaster recovery capabilities."
    type: "sentinel"
  backup-recovery-point-encrypted:
    path: "policies/backup/backup-recovery-point-encrypted.sentinel"
    governed_resources: ["aws_backup_framework"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "Backup"
    description: "This policy checks if resources of type 'aws_backup_framework' have the attribute 'control' value set to 'BACKUP_RECOVERY_POINT_ENCRYPTED'"
    type: "sentinel"
  backup-recovery-point-manual-deletion-disabled:
    path: "policies/backup/backup-recovery-point-manual-deletion-disabled.sentinel"
    governed_resources: ["aws_backup_vault", "aws_backup_vault_policy"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "Backup"
    description: "This policy checks if AWS Backup vaults have resource-based policies that prevent manual deletion of recovery points. The rule is NON_COMPLIANT if the Backup Vault does not have resource-based policies or has policies without a suitable 'Deny' statement with backup:DeleteRecoveryPoint, backup:UpdateRecoveryPointLifecycle, and backup:PutBackupVaultAccessPolicy permissions."
    type: "sentinel"
  cloudfront-distributions-should-encrypt-traffic-to-custom-origins:
    path: "policies/cloudfront/cloudfront-distributions-should-encrypt-traffic-to-custom-origins.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudFront"
    description: "This control checks whether 'aws_cloudfront_distribution' are encrypting traffic to custom origins."
    type: "sentinel"
  cloudfront-distributions-should-have-logging-enabled:
    path: "policies/cloudfront/cloudfront-distributions-should-have-logging-enabled.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudFront"
    description: "This control checks whether server access logging is enabled on 'aws_cloudfront_distribution'."
    type: "sentinel"
  cloudfront-distributions-should-use-custom-ssl-tls-certificates:
    path: "policies/cloudfront/cloudfront-distributions-should-use-custom-ssl-tls-certificates.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudFront"
    description: "This control checks whether 'aws_cloudfront_distribution' are using the default SSL/TLS certificate CloudFront provides."
    type: "sentinel"
  cloudfront-should-require-encryption-in-transit:
    path: "policies/cloudfront/cloudfront-should-require-encryption-in-transit.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudFront"
    description: "This control checks whether an 'aws_cloudfront_distribution' requires viewers to use HTTPS directly or whether it uses redirection."
    type: "sentinel"
  cloudtrail-log-file-validation-enabled:
    path: "policies/cloudtrail/cloudtrail-log-file-validation-enabled.sentinel"
    governed_resources: ["aws_cloudtrail"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudTrail"
    description: "This policy requires resources of type `aws_cloudtrail` to have log file validation enabled."
    type: "sentinel"
  cloudtrail-s3-dataevents-enabled:
    path: "policies/cloudtrail/cloudtrail-s3-dataevents-enabled.sentinel"
    governed_resources: ["aws_cloudtrail"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudTrail"
    description: "This policy verifies that at least one AWS CloudTrail trail is logging Amazon S3 data events for all S3 buckets."
    type: "sentinel"
  cloudtrail-security-best-practices:
    path: "policies/cloudtrail/cloudtrail-security-best-practices.sentinel"
    governed_resources: ["aws_cloudtrail"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudTrail"
    description: "This policy ensures that at least one AWS CloudTrail trail is defined with security best practices according to AWS Audit Manager requirements."
    type: "sentinel"
  cloudtrail-server-side-encryption-enabled:
    path: "policies/cloudtrail/cloudtrail-server-side-encryption-enabled.sentinel"
    governed_resources: ["aws_cloudtrail"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudTrail"
    description: "This policy requires that resources of type `aws_cloudtrail` have server-side encryption enabled."
    type: "sentinel"
  cloudwatch-alarms-should-have-specified-actions-configured:
    path: "policies/cloudwatch/cloudwatch-alarms-should-have-specified-actions-configured.sentinel"
    governed_resources: ["aws_cloudwatch_composite_alarm", "aws_cloudwatch_metric_alarm"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudWatch"
    description: "CloudWatch.15 This control checks whether an Amazon CloudWatch alarm has at least one action configured for the ALARM state."
    type: "sentinel"
  cloudwatch-log-group-kms-encryption:
    path: "policies/cloudwatch/cloudwatch-log-group-kms-encryption.sentinel"
    governed_resources: ["aws_cloudwatch_log_group"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudWatch"
    description: "This policy verifies that Amazon CloudWatch Log Groups are encrypted with AWS KMS. Optionally, it can check for a specific KMS key ID if provided."
    type: "sentinel"
  cloudwatch-log-groups-should-be-retained-for-a-specified-time-period:
    path: "policies/cloudwatch/cloudwatch-log-groups-should-be-retained-for-a-specified-time-period.sentinel"
    governed_resources: ["aws_cloudwatch_log_group"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CloudWatch"
    description: "CloudWatch.16 This control checks whether an Amazon CloudWatch log group has a retention period of at least the specified number of days."
    type: "sentinel"
  codebuild-project-artifact-encryption:
    path: "policies/codebuild/codebuild-project-artifact-encryption.sentinel"
    governed_resources: ["aws_codebuild_project"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CodeBuild"
    description: "This policy verifies that AWS CodeBuild projects have encryption enabled for all artifacts. According to AWS best practices, artifacts should be encrypted to protect sensitive build outputs."
    type: "sentinel"
  codebuild-project-environments-should-have-a-logging-aws-configuration:
    path: "policies/codebuild/codebuild-project-environments-should-have-a-logging-aws-configuration.sentinel"
    governed_resources: ["aws_codebuild_project"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CodeBuild"
    description: "This control checks whether a 'aws_codebuild_project' has at least one log option, either to S3 or CloudWatch logs enabled."
    type: "sentinel"
  codebuild-project-privileged-mode-disabled:
    path: "policies/codebuild/codebuild-project-privileged-mode-disabled.sentinel"
    governed_resources: ["aws_codebuild_project"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CodeBuild"
    description: "This policy checks if AWS CodeBuild projects have privileged mode disabled in their environment configuration."
    type: "sentinel"
  codebuild-s3-logs-should-be-encrypted:
    path: "policies/codebuild/codebuild-s3-logs-should-be-encrypted.sentinel"
    governed_resources: ["aws_codebuild_project"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "CodeBuild"
    description: "This control checks if Amazon S3 logs for an 'aws_codebuild_project' are encrypted."
    type: "sentinel"
  dms-endpoint-should-be-ssl-configured:
    path: "policies/dms/dms-endpoint-should-be-ssl-configured.sentinel"
    governed_resources: ["aws_dms_endpoint"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DMS"
    description: "This policy checks if resources of type 'aws_dms_endpoint' have the 'certificate_arn' shouldn't be empty"
    type: "sentinel"
  dms-endpoints-should-use-ssl:
    path: "policies/dms/dms-endpoints-should-use-ssl.sentinel"
    governed_resources: ["aws_dms_endpoint"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DMS"
    description: "This policy requires resources of type `aws_dms_endpoint` have attribute \"ssl_mode\" set to one of: require, verify-ca, verify-full."
    type: "sentinel"
  dms-redis-tls-enabled:
    path: "policies/dms/dms-redis-tls-enabled.sentinel"
    governed_resources: ["aws_dms_endpoint"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DMS"
    description: "This policy checks if resources of type 'aws_dms_endpoint' have the 'ssl_security_protocol' set to 'ssl-encryption' in 'redis_settings' for engine of type 'redis'"
    type: "sentinel"
  dms-replication-task-logging-enabled:
    path: "policies/dms/dms-replication-task-logging-enabled.sentinel"
    governed_resources: ["aws_dms_replication_task"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DMS"
    description: "This policy checks if resources of type 'aws_dms_replication_task' have the 'replication_task_settings' have logging enabled"
    type: "sentinel"
  docdb-cluster-backup-retention-check:
    path: "policies/docdb/docdb-cluster-backup-retention-check.sentinel"
    governed_resources: ["aws_docdb_cluster"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DocDB"
    description: "This policy checks if resources of type 'aws_docdb_cluster' have the 'backup-retention-period' attribute set in between '7 to 35'"
    type: "sentinel"
  docdb-cluster-storage-encrypted:
    path: "policies/docdb/docdb-cluster-storage-encrypted.sentinel"
    governed_resources: ["aws_docdb_cluster"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DocDB"
    description: "This policy checks if resources of type 'aws_docdb_cluster' have the 'storage_encrypted' attribute set to true"
    type: "sentinel"
  dynamo-db-accelerator-clusters-encryption-at-rest-enabled:
    path: "policies/dynamo-db/dynamo-db-accelerator-clusters-encryption-at-rest-enabled.sentinel"
    governed_resources: ["aws_dax_cluster"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DynamoDB"
    description: "This policy requires that `server_side_encryption` attribute of the `aws_dax_cluster` resource has `enabled` set to true"
    type: "sentinel"
  dynamo-db-accelerator-clusters-encryption-in-transit-enabled:
    path: "policies/dynamo-db/dynamo-db-accelerator-clusters-encryption-in-transit-enabled.sentinel"
    governed_resources: ["aws_dax_cluster"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DynamoDB"
    description: "This policy requires that the `aws_dax_cluster` resource has `cluster_endpoint_encryption_type` attribute set to `TLS`"
    type: "sentinel"
  dynamo-db-recovery-point-created:
    path: "policies/dynamo-db/dynamo-db-recovery-point-created.sentinel"
    governed_resources: ["aws_backup_plan", "aws_backup_selection", "aws_dynamodb_table"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DynamoDB"
    description: "This policy verifies that Amazon DynamoDB tables have backup recovery points created within a specified period to support disaster recovery requirements."
    type: "sentinel"
  dynamo-db-table-encrypted-kms:
    path: "policies/dynamo-db/dynamo-db-table-encrypted-kms.sentinel"
    governed_resources: ["aws_dynamodb_table"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DynamoDB"
    description: "This policy verifies that AWS DynamoDB tables are encrypted with AWS KMS. It checks the `server_side_encryption` block to ensure KMS encryption is enabled."
    type: "sentinel"
  dynamo-db-table-encryption-enabled:
    path: "policies/dynamo-db/dynamo-db-table-encryption-enabled.sentinel"
    governed_resources: ["aws_dynamodb_table"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DynamoDB"
    description: "This policy verifies that Amazon DynamoDB tables have encryption enabled to protect data at rest in accordance with AWS Audit Manager requirements."
    type: "sentinel"
  dynamo-db-tables-point-in-time-recovery-enabled:
    path: "policies/dynamo-db/dynamo-db-tables-point-in-time-recovery-enabled.sentinel"
    governed_resources: ["aws_dynamodb_table"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DynamoDB"
    description: "This policy requires that `point_in_time_recovery` attribute of the `aws_dynamodb_table` resource has `enabled` set to true"
    type: "sentinel"
  dynamo-db-tables-scales-capacity-with-demand:
    path: "policies/dynamo-db/dynamo-db-tables-scales-capacity-with-demand.sentinel"
    governed_resources: ["aws_appautoscaling_policy", "aws_appautoscaling_target", "aws_dynamodb_table"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "DynamoDB"
    description: "This policy requires that `aws_dynamodb_table` resources with 'billing_mode' attribute set to 'PROVISIONED' have autoscaling configured"
    type: "sentinel"
  ebs-backup-recovery-point-created:
    path: "policies/ec2/ebs-backup-recovery-point-created.sentinel"
    governed_resources: ["aws_backup_plan", "aws_backup_selection", "aws_ebs_volume"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy ensures that Amazon EBS volumes are configured with AWS Backup coverage that can create recovery points within the specified time period."
    type: "sentinel"
  ebs-volumes-backup-plan-protection:
    path: "policies/ec2/ebs-volumes-backup-plan-protection.sentinel"
    governed_resources: ["aws_backup_selection", "aws_ebs_volume"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy checks if Amazon Elastic Block Store (Amazon EBS) volumes are protected by a backup plan. EBS volumes should be included in AWS Backup plans to ensure data protection and disaster recovery."
    type: "sentinel"
  ebs-volumes-should-be-in-a-backup-plan:
    path: "policies/ec2/ebs-volumes-should-be-in-a-backup-plan.sentinel"
    governed_resources: ["aws_backup_plan", "aws_backup_selection", "aws_ebs_volume"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "EC2.28 This control evaluates if an Amazon EBS volume in in-use state is covered by a backup plan."
    type: "sentinel"
  ec2-attached-ebs-volumes-encrypted-at-rest:
    path: "policies/ec2/ec2-attached-ebs-volumes-encrypted-at-rest.sentinel"
    governed_resources: ["aws_ebs_volume", "aws_volume_attachment"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy requires `aws_ebs_volume` resources to be encrypted and in attached state."
    type: "sentinel"
  ec2-autoscaling-capacity-rebalancing-enabled:
    path: "policies/ec2/ec2-autoscaling-capacity-rebalancing-enabled.sentinel"
    governed_resources: ["aws_autoscaling_group"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy requires that Capacity Rebalancing is enabled for Amazon EC2 Auto Scaling groups that use multiple instance types."
    type: "sentinel"
  ec2-backup-recovery-point-time-period:
    path: "policies/ec2/ec2-backup-recovery-point-time-period.sentinel"
    governed_resources: ["aws_backup_plan", "aws_backup_selection", "aws_ebs_volume"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy verifies that Amazon EBS volumes are covered by AWS Backup plans that can create recovery points within the specified time period."
    type: "sentinel"
  ec2-belong-to-vpc:
    path: "policies/ec2/ec2-belong-to-vpc.sentinel"
    governed_resources: ["aws_instance", "aws_network_interface", "aws_subnet"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy verifies that EC2 instances belong to a virtual private cloud (VPC)."
    type: "sentinel"
  ec2-client-vpn-connection-log-enabled:
    path: "policies/ec2/ec2-client-vpn-connection-log-enabled.sentinel"
    governed_resources: ["aws_ec2_client_vpn_endpoint"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy checks if resources of type 'aws_ec2_client_vpn_endpoint' have the cloudwatch logs enabled in the 'connection_log_options' attribute"
    type: "sentinel"
  ec2-ebs-encryption-enabled:
    path: "policies/ec2/ec2-ebs-encryption-enabled.sentinel"
    governed_resources: ["aws_ebs_volume"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy requires resources of type `aws_ebs_volume` have the `encrypted` attribute set to `true`."
    type: "sentinel"
  ec2-ebs-snapshot-public-restorable-check-account-level:
    path: "policies/ec2/ec2-ebs-snapshot-public-restorable-check-account-level.sentinel"
    governed_resources: ["aws_ebs_snapshot_block_public_access"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy requires `aws_ebs_snapshot_block_public_access` resources to have attribute state to either 'block-new-sharing' or 'block-all-sharing'."
    type: "sentinel"
  ec2-incoming-ssh-should-be-restricted:
    path: "policies/ec2/ec2-incoming-ssh-should-be-restricted.sentinel"
    governed_resources: ["aws_vpc_security_group_ingress_rule"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy ensures that AWS security groups do not allow unrestricted SSH access from the internet (0.0.0.0/0 or ::/0)."
    type: "sentinel"
  ec2-instance-profile-required:
    path: "policies/ec2/ec2-instance-profile-required.sentinel"
    governed_resources: ["aws_instance"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy requires that EC2 instances have an IAM instance profile attached. This ensures proper identity and access management for EC2 instances."
    type: "sentinel"
  ec2-internet-gateway-allow-authorized-vpc-only:
    path: "policies/ec2/ec2-internet-gateway-allow-authorized-vpc-only.sentinel"
    governed_resources: ["aws_internet_gateway", "aws_internet_gateway_attachment"]
    provider: "AWS"
    regulations:
      - name: "ISO/IEC 27001 Annex A"
        version: "2013"
    service: "EC2"
    description: "This policy verifies that internet gateways are only attached to authorized VPCs. The rule is NON_COMPLIANT if internet gateways are attached to unauthorized VPCs."
    type: "sentinel"
  ec2-launch-template-public-ip-disabled:
    path: "policies/ec2/ec2-launch-template-public-ip-disabled.sentinel"
    governed_resources: ["aws_launch_template"]
